<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07060d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Keeping Gem">
  <title>Keeping Gem</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <!-- 고른 스킨을 그리기 전에 적어 둔다 — 영수증 스킨인데 첫 화면만 까맣게 뜨는 일을 막는다 -->
  <script>
    try {
      var skin = localStorage.getItem('keeping-gem:theme')
      if (skin === 'receipt') {
        document.documentElement.dataset.theme = skin
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#e9e6e0')
      }
    } catch (e) {}
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
